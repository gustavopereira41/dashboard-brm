<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BRM - Executivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-screen flex overflow-hidden">

    <div id="loading" class="fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex flex-col items-center justify-center text-white transition-opacity duration-300">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-orange-500 mb-4"></i>
        <p class="text-xl font-semibold">Sincronizando com a Nuvem...</p>
        <p class="text-sm text-slate-400 mt-2">Aguarde, conectando via JSONP.</p>
    </div>

    <!-- Modal Novo Projeto -->
    <div id="newProjectModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-slate-800"><i class="fa-solid fa-folder-plus text-orange-500 mr-2"></i> Adicionar Novo Projeto</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Nome do Projeto</label>
                    <input type="text" id="newProjName" class="w-full border p-2.5 rounded-lg outline-none text-sm focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Status Inicial</label>
                    <select id="newProjStatus" class="w-full border p-2.5 rounded-lg outline-none text-sm focus:ring-2 focus:ring-orange-500">
                        <option>Planejamento</option><option>Em Execução</option><option>Backlog</option><option>Concluído</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Prioridade</label>
                    <select id="newProjPriority" class="w-full border p-2.5 rounded-lg outline-none text-sm focus:ring-2 focus:ring-orange-500">
                        <option>Alta prioridade</option><option>Média prioridade</option><option>Baixa prioridade</option><option>Falta avaliar</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Área / Frente</label>
                    <input type="text" id="newProjArea" class="w-full border p-2.5 rounded-lg outline-none text-sm focus:ring-2 focus:ring-orange-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium">Cancelar</button>
                <button onclick="saveNewProject()" class="px-4 py-2 bg-orange-500 text-white hover:bg-orange-600 rounded-lg text-sm font-medium shadow-md">Salvar na Planilha</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10">
        <div class="p-6 border-b border-slate-700">
            <h1 class="text-xl font-bold text-orange-500">PORTFÓLIO BRM</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="w-full flex items-center gap-3 p-3 rounded-lg text-left bg-orange-600 text-white"><i class="fa-solid fa-chart-pie w-5"></i> Dashboard</button>
            <button onclick="switchTab('portfolio')" id="btn-portfolio" class="w-full flex items-center gap-3 p-3 rounded-lg text-left text-slate-300 hover:bg-slate-800"><i class="fa-solid fa-list-check w-5"></i> Gestão do Backlog</button>
        </nav>
        <div class="p-4 border-t border-slate-700 text-xs text-green-400 text-center"><i class="fa-solid fa-link"></i> API JSONP Conectada</div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white shadow-sm p-6 flex justify-between items-center z-0 relative">
            <h2 id="page-title" class="text-2xl font-semibold text-slate-800">Visão Executiva</h2>
            <button onclick="fetchDataJSONP()" class="text-sm text-blue-600 hover:bg-blue-50 border border-blue-200 px-4 py-2 rounded-lg font-medium"><i class="fa-solid fa-rotate mr-2"></i> Atualizar Dados</button>
        </header>

        <div class="p-8 max-w-7xl mx-auto w-full">
            <!-- DASHBOARD -->
            <div id="dashboard" class="tab-content active space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-slate-400"><h3 class="text-slate-500 text-sm">Total Projetos</h3><p id="kpi-total" class="text-4xl font-bold mt-2">-</p></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500"><h3 class="text-slate-500 text-sm">Ativos</h3><p id="kpi-ativos" class="text-4xl font-bold mt-2">-</p></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-500"><h3 class="text-slate-500 text-sm">Concluídos</h3><p id="kpi-concluidos" class="text-4xl font-bold mt-2">-</p></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500"><h3 class="text-slate-500 text-sm">No Backlog</h3><p id="kpi-backlog" class="text-4xl font-bold mt-2">-</p></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-4 text-slate-700">Status</h3><div class="h-72 relative"><canvas id="statusChart"></canvas></div></div>
                    <div class="bg-white p-6 rounded-xl shadow-sm"><h3 class="font-semibold mb-4 text-slate-700">Prioridade</h3><div class="h-72 relative"><canvas id="priorityChart"></canvas></div></div>
                </div>
            </div>

            <!-- PORTFÓLIO -->
            <div id="portfolio" class="tab-content">
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b flex justify-between items-center bg-slate-50">
                        <h3 class="text-lg font-semibold text-slate-700">Lista Unificada de Projetos</h3>
                        <button onclick="openModal()" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg shadow-md hover:bg-slate-700 text-sm"><i class="fa-solid fa-plus mr-2"></i> Novo Projeto</button>
                    </div>
                    <div class="overflow-x-auto max-h-[600px]">
                        <table class="w-full text-left" id="portfolioTable">
                            <thead class="bg-white text-slate-600 text-sm sticky top-0 shadow-sm z-10">
                                <tr>
                                    <th class="p-4 font-semibold w-1/3">Nome do Projeto</th><th class="p-4 font-semibold w-1/4">Área</th><th class="p-4 font-semibold w-1/6">Prioridade</th><th class="p-4 font-semibold w-1/4">Status <span class="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full ml-2">Editável</span></th>
                                </tr>
                            </thead>
                            <tbody class="text-sm divide-y divide-slate-100" id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const APP_SCRIPT_URL = "https://script.google.com/a/macros/natura.net/s/AKfycbxirkhp98X9Vo8N-TdW84Cd1x98FC7G6kuWBc67jWFxC7EwHAcLh9cyAYa-F-Se1geBUw/exec";
        let chartInstances = {};

        window.onload = () => { fetchDataJSONP(); };

        // === JSONP FUNCTION (CONTORNO DO CORS PARA LEITURA E GRAVAÇÃO) ===
        // Cria um script dinâmico. O Google Apps Script vai retornar os dados dentro de uma função.
        function fetchDataJSONP() {
            document.getElementById('loading').style.display = 'flex';
            
            // Remove scripts JSONP antigos para não sujar a página
            const oldScript = document.getElementById('jsonpRequest');
            if (oldScript) oldScript.remove();

            // Adiciona a tag script apontando para a URL com um callback
            const script = document.createElement('script');
            script.id = 'jsonpRequest';
            script.src = APP_SCRIPT_URL + '?callback=processDataJSONP';
            
            script.onerror = function() {
                alert("Erro ao conectar. Verifique se você está logado na sua conta Google corporativa.");
                document.getElementById('loading').style.display = 'none';
            };

            document.body.appendChild(script);
        }

        // Essa função será executada automaticamente quando o script retornar
        window.processDataJSONP = function(rows) {
            
            if (rows && rows.error) {
                alert("Erro da Planilha: " + rows.error);
                document.getElementById('loading').style.display = 'none';
                return;
            }

            let dataStatus = {}; let dataPriority = {}; let projects = [];
            
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (r[0] && r[0].toString().trim() !== '') {
                    projects.push({ name: r[0], status: r[1] || 'Falta avaliar', priority: r[2] || 'Falta avaliar', area: r[3] || '-' });
                }
                if (r[9] && r[10] !== '') { dataStatus[r[9].toString().trim()] = parseFloat(r[10]) || 0; }
                if (r[12] && r[13] !== '') { dataPriority[r[12].toString().trim()] = parseFloat(r[13]) || 0; }
            }
            renderDashboard(dataStatus, dataPriority, projects);
            document.getElementById('loading').style.display = 'none';
        };

        function renderDashboard(dataStatus, dataPriority, projects) {
            document.getElementById('kpi-total').innerText = projects.length;
            document.getElementById('kpi-ativos').innerText = (dataStatus['Em Execução'] || 0) + (dataStatus['Planejamento'] || 0);
            document.getElementById('kpi-concluidos').innerText = dataStatus['Concluído'] || 0;
            document.getElementById('kpi-backlog').innerText = dataStatus['Backlog'] || 0;

            ['statusChart', 'priorityChart'].forEach(id => { if(chartInstances[id]) chartInstances[id].destroy(); });

            chartInstances['statusChart'] = new Chart(document.getElementById('statusChart'), { type: 'doughnut', data: { labels: Object.keys(dataStatus).length ? Object.keys(dataStatus) : ['Carregando'], datasets: [{ data: Object.keys(dataStatus).length ? Object.values(dataStatus) : [1], backgroundColor: ['#94a3b8', '#ef4444', '#22c55e', '#3b82f6', '#f59e0b'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
            chartInstances['priorityChart'] = new Chart(document.getElementById('priorityChart'), { type: 'bar', data: { labels: Object.keys(dataPriority), datasets: [{ data: Object.values(dataPriority), backgroundColor: '#f97316' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: {legend:{display:false}} } });

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            projects.forEach(proj => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-4 font-medium">${proj.name}</td><td class="p-4">${proj.area}</td><td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded text-xs font-medium">${proj.priority}</span></td>
                    <td class="p-4">
                        <select onchange="updateStatusJSONP('${proj.name}', this.value)" class="border rounded p-2 w-full bg-white outline-none focus:ring-1 focus:ring-orange-400 text-sm shadow-sm cursor-pointer">
                            <option value="${proj.status}" selected hidden>${proj.status}</option>
                            <option value="Planejamento">Planejamento</option><option value="Em Execução">Em Execução</option><option value="Backlog">Backlog</option><option value="Concluído">Concluído</option><option value="Cancelado">Cancelado</option>
                        </select>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        // Função de Alteração (Usando no-cors via fetch, pois POST não aceita JSONP direto)
        function updateStatusJSONP(projectName, newStatus) {
            document.getElementById('loading').style.display = 'flex';
            const urlWithParams = `${APP_SCRIPT_URL}?action=updateStatus&name=${encodeURIComponent(projectName)}&newStatus=${encodeURIComponent(newStatus)}&callback=updateCallback`;
            
            const script = document.createElement('script');
            script.src = urlWithParams;
            document.body.appendChild(script);
        }

        function saveNewProject() {
            const name = document.getElementById('newProjName').value;
            const status = document.getElementById('newProjStatus').value;
            const priority = document.getElementById('newProjPriority').value;
            const area = document.getElementById('newProjArea').value;

            if(!name) return alert("O Nome do Projeto é obrigatório.");

            document.getElementById('loading').style.display = 'flex';
            closeModal();

            const urlWithParams = `${APP_SCRIPT_URL}?action=add&name=${encodeURIComponent(name)}&status=${encodeURIComponent(status)}&priority=${encodeURIComponent(priority)}&area=${encodeURIComponent(area)}&callback=updateCallback`;
            
            const script = document.createElement('script');
            script.src = urlWithParams;
            document.body.appendChild(script);
        }

        window.updateCallback = function(response) {
            // Após 1 segundo da gravação, recarrega os dados completos
            setTimeout(() => { fetchDataJSONP(); }, 1000);
        }

        function openModal() { document.getElementById('newProjectModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('newProjectModal').classList.add('hidden'); }
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => { btn.classList.remove('bg-orange-600', 'text-white'); btn.classList.add('text-slate-300'); });
            document.getElementById(tabId).classList.add('active');
            document.getElementById(`btn-${tabId}`).classList.remove('text-slate-300');
            document.getElementById(`btn-${tabId}`).classList.add('bg-orange-600', 'text-white');
            document.getElementById('page-title').innerText = tabId === 'dashboard' ? 'Visão Executiva' : 'Gestão do Backlog';
        }
    </script>
</body>
</html>
